<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Monitor Clone</title>
    <meta name="description" content="Track new uploads, title rewrites, thumbnail swaps and A/B tests across the YouTube channels you watch." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/" data-link>
          <span class="eyes" aria-hidden="true"><i></i><i></i></span>
          <span class="brand-name">YouTube Monitor Clone</span>
        </a>
        <nav class="nav">
          <a href="/" data-link data-route="feed">Feed</a>
          <a href="/channels" data-link data-route="channels">Channels</a>
          <a href="/settings" data-link data-route="settings">Settings</a>
        </nav>
        <div class="topbar-right">
          <span class="plan-badge">SOLO</span>
          <span class="avatar" aria-hidden="true">👀</span>
        </div>
      </div>
    </header>

    <main id="app" class="page"></main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
